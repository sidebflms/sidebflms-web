<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385">
  <!--
    SILUETA MACIZA DEL CASETE, PARA USARLA COMO MÁSCARA DE LA INTRO.

    El logotipo del manual está dibujado con líneas finas: como ventana apenas
    dejaría ver vídeo. Esto es el mismo casete con las proporciones del PNG-05
    del manual, pero en macizo: el CUERPO es opaco (ahí se ve el vídeo) y los
    detalles son huecos transparentes (ahí se ve el naranja del fondo).

    Se usa como `mask-image`, que lee la TRANSPARENCIA: por eso los huecos se
    hacen con una <mask> interna y no pintándolos de negro.
  -->
  <defs>
    <mask id="casete">
      <!-- Cuerpo -->
      <rect x="0" y="0" width="600" height="385" rx="28" fill="#fff"/>
      <!-- Etiqueta de arriba -->
      <rect x="38" y="20" width="524" height="56" rx="12" fill="#000"/>
      <!-- Bobina izquierda: anillo hueco con el centro macizo -->
      <circle cx="155" cy="155" r="80" fill="#000"/>
      <circle cx="155" cy="155" r="42" fill="#fff"/>
      <circle cx="155" cy="155" r="14" fill="#000"/>
      <!-- Bobina derecha -->
      <circle cx="422" cy="172" r="90" fill="#000"/>
      <circle cx="422" cy="172" r="47" fill="#fff"/>
      <circle cx="422" cy="172" r="15" fill="#000"/>
      <!-- Ranura de la ventana -->
      <rect x="50" y="237" width="500" height="33" rx="7" fill="#000"/>
      <!-- Zona de la cinta, abajo -->
      <path d="M110 293 H490 L515 385 H85 Z" fill="#000"/>
      <circle cx="140" cy="362" r="10" fill="#fff"/>
      <circle cx="178" cy="356" r="9" fill="#fff"/>
      <circle cx="422" cy="356" r="9" fill="#fff"/>
      <circle cx="460" cy="362" r="10" fill="#fff"/>
      <!-- Tornillos de las esquinas -->
      <rect x="28" y="302" width="42" height="52" rx="16" fill="#000"/>
      <rect x="530" y="302" width="42" height="52" rx="16" fill="#000"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="600" height="385" rx="28" fill="#000" mask="url(#casete)"/>
</svg>
