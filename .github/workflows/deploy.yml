name: Publicar en nastos

# Cada empujón a `main` sube el código al VPS, lo compila allí y reinicia el
# proceso.
#
# ── En qué se diferencia del workflow del inventario ─────────────────────
# Aquél hace `git pull` DENTRO del servidor, lo que obliga a que el servidor
# tenga acceso de lectura a GitHub: una deploy key más que crear, que guardar
# y que acordarse de rotar.
#
# Aquí no. El runner ya tiene el código (lo acaba de descargar) y ya tiene una
# llave para entrar en el VPS. Con rsync se lo lleva directamente, y el
# servidor no necesita saber que GitHub existe. Una credencial menos.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Dos despliegues a la vez dejarían el directorio a medias mientras uno
# compila y el otro sobrescribe. Se encolan.
concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # v7 y no v4: las de la serie v4 corren sobre Node 20, que GitHub está
      # retirando de los runners. Hoy sólo avisa; el día que lo quite del todo,
      # el despliegue dejaría de funcionar por algo que no tiene nada que ver
      # con lo que se acabe de tocar. Lo que v7 rompe frente a v4 es el
      # checkout de PRs de forks en `pull_request_target`, que aquí no se usa:
      # esto sólo hace checkout en empujones a `main`.
      - uses: actions/checkout@v7
        with:
          # Historia completa a propósito. El rsync de abajo NO excluye el
          # `.git`, así que el que acaba en el servidor es éste: con el
          # `fetch-depth: 1` que viene por defecto, allí quedaba un clon
          # superficial de un solo commit —comprobado tras el despliegue del
          # 10-09-2026— y el `git log` del servidor no servía para nada.
          #
          # Que el servidor quede exactamente en el commit publicado está bien
          # y se queda así; lo que hacía falta es que además pueda contar de
          # dónde viene.
          fetch-depth: 0

      - name: Cargar la llave del VPS
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copia de seguridad de lo publicado
        # Antes de tocar nada, lo que está en el aire se copia en el propio
        # servidor: la carpeta de la web (con su `.git` y su `.next`, sin
        # `node_modules`, que `npm ci` rehace) y `public_html` entero, con el
        # `.htaccess`, el proxy y el `.htpasswd`. Se guardan las TRES últimas.
        # Si la copia falla (disco lleno, por ejemplo) el job se para aquí y no
        # se publica nada. Cómo volver a una: despliegue/README.md.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'COPIA'
          set -euo pipefail
          ORIGEN="$HOME/sidebflms-web"
          [ -d "$ORIGEN" ] || { echo "No hay web anterior que copiar"; exit 0; }
          commit="$(git -C "$ORIGEN" rev-parse --short HEAD 2>/dev/null || echo sin-git)"
          DESTINO="$HOME/copias-web/sidebflms-web-$(date +%Y%m%d-%H%M%S)-$commit"
          mkdir -p "$DESTINO"
          rsync -a --exclude 'node_modules' --exclude '.next/cache' --exclude '*.log' \
            --exclude '.vigilante.lock' --exclude '.operacion.lock' \
            "$ORIGEN/" "$DESTINO/codigo/"
          rsync -a "$HOME/web/sidebflms.com/public_html/" "$DESTINO/public_html/"
          ls -1dt "$HOME"/copias-web/sidebflms-web-* | tail -n +4 | xargs -r rm -rf
          echo "Copia en $DESTINO ($(du -sh "$DESTINO" | cut -f1))"
          df -h "$HOME" | tail -1
          COPIA

      - name: Subir el código
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          # `--delete` para que un fichero borrado en el repositorio
          # desaparezca también del servidor. Las exclusiones son cosas que se
          # generan allí y que borrar obligaría a recompilar de cero cada vez.
          #
          # SE EXCLUYE `.env*` Y NO SÓLO `.env`: la configuración del servidor
          # puede estar en `.env.production` —así lo pide el README de la
          # analítica— y con el patrón antiguo el despliegue la BORRABA sin
          # avisar. La web seguía arrancando, pero sin base de datos ni
          # analítica, y el motivo no aparecía por ningún lado. (2026-09-22)
          #
          # TAMBIÉN SE EXCLUYE `.clave-panel`: es la contraseña de la base de
          # datos del panel, vive sólo en el servidor y no está en el
          # repositorio, así que `--delete` la BORRABA en cada publicación.
          # La web arrancaba sin base de datos y el despliegue fallaba al
          # compilar, quejándose de un fichero que nadie había tocado.
          # (2026-09-22)
          #
          # Y NADA DE COMENTARIOS ENTRE LAS LÍNEAS DEL COMANDO: con la barra
          # al final, la siguiente línea es continuación, así que una
          # almohadilla ahí NO es un comentario, es un argumento más para
          # rsync. Costó otro despliegue fallido el mismo día.
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.next-nueva' \
            --exclude '.next-anterior' \
            --exclude '.env*' \
            --exclude '.clave-panel' \
            --exclude '*.log' \
            --exclude '.vigilante.lock' \
            --exclude '.operacion.lock' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/sidebflms-web/"

      - name: Compilar y reiniciar
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd ~/sidebflms-web && ./despliegue/publicar.sh'

      - name: Comprobar que responde de verdad desde fuera
        # Que el proceso esté vivo no significa que sirva páginas. Se acepta
        # 401 porque mientras la web esté con contraseña, eso es EXACTAMENTE
        # lo que debe contestar a quien no la sabe: si un día contestara 200,
        # es que la contraseña se ha caído y la web está abierta sin querer.
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://sidebflms.com/es)
          echo "GET https://sidebflms.com/es -> $codigo"
          case "$codigo" in
            200|307|401) echo "correcto" ;;
            *) echo "No responde como debería"; exit 1 ;;
          esac
